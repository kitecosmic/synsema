name: release

# Cross-compile the Synsema binary for Linux/macOS/Windows and publish to a
# GitHub Release. Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`),
# or manually via the Actions tab. The asset names match install.sh / install.ps1.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Crea la Release UNA sola vez antes del matrix. Sin esto, los 4 jobs corren a
  # crearla concurrentemente y los que pierden la carrera mueren con
  # "already_exists" (pasó en v0.4.9: quedaron dos releases del mismo tag con los
  # assets repartidos). El matrix ahora sólo ADJUNTA assets a una release que existe.
  prepare:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release once
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes

  build:
    name: ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: synsema-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: synsema-macos-aarch64
          # Built on the ARM runner (cross to x86_64) — macos-13 Intel runners are
          # scarce/queued on the free tier; Apple's toolchain cross-compiles fine.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: synsema-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: synsema-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ring (the rustls crypto backend) assembles with NASM on windows-msvc;
      # the runners don't ship it. Linux/macOS use the system assembler (no-op here).
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # SYNSEMA_VERSION = el tag que disparó el release (p. ej. v0.3.2). El binario lo
      # hornea como su versión (ver crates/synsema-cli/build.rs) → `synsema version`
      # reporta el release, no el commit de main.
      #
      # `--features llm-local` (desde v0.4.5): los binarios oficiales traen el provider
      # LLM local embebido (GGUF con candle, CPU). Sin RUSTFLAGS de target-cpu: el binario
      # queda portable (los kernels AVX2 cuantizados de candle son compile-time y NO se
      # activan) — el prefill local es ~3× más lento que un build propio con
      # `-C target-cpu=native`; la doc (página 52) enseña ese build para quien lo quiera.
      - name: Build
        env:
          SYNSEMA_VERSION: ${{ github.ref_name }}
        run: cargo build --release --locked --manifest-path engine/Cargo.toml -p synsema-cli --features llm-local --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp "engine/target/${{ matrix.target }}/release/synsema" "${{ matrix.asset }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "engine/target/${{ matrix.target }}/release/synsema.exe" "${{ matrix.asset }}"
          (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  # NOTE: aarch64-linux is deferred (needs a C cross-toolchain for rusqlite's bundled
  # SQLite). Add it later via `cross` or a gcc-aarch64 setup if there's demand.
