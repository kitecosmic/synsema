name: ci

# Build + test the workspace on every push and PR.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
      - name: Test
        run: cargo test --locked --manifest-path engine/Cargo.toml --workspace

  # Supply-chain: cargo audit contra la base RustSec en cada push/PR.
  # Falla ante una vulnerabilidad conocida en Cargo.lock (los warnings
  # "unmaintained" no cortan el build; se revisan al actualizar deps).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --file engine/Cargo.lock
