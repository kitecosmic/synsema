[workspace]
resolver = "2"
members = [
    "crates/synsema-core",
    "crates/synsema-capabilities",
    "crates/synsema-stdlib",
    "crates/synsema-agents",
    "crates/synsema-llm",
    "crates/synsema-runtime",
    "crates/synsema-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Synsema — a programming language designed for AI agents (Rust port)"
repository = "https://github.com/kitecosmic/synsema"

# Dependencias compartidas se pinean acá y se referencian con `workspace = true`
# desde cada crate. Se agregan por capa, no antes de necesitarlas.
[workspace.dependencies]
# Modelo numérico: enteros de precisión arbitraria como Python (fast-path i64 +
# promoción a BigInt por overflow). num-traits/num-integer dan conversores y ops.
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
# Map ordenado (Python dict preserva orden de inserción) y regex (puro Rust, sin C).
indexmap = "2"
regex = "1"
# Decimal exacto base-10 para dinero/finanzas (tipo Decimal). Puro Rust (96-bit,
# 28-29 dígitos significativos), sin deps C → preserva el binario único estático.
rust_decimal = { version = "1", features = ["db-postgres"] }
# RNG no-cripto para los builtins random()/random_int() (paridad con el `random` de
# Python). getrandom ya entra transitivamente; rand da la API de distribución/rango.
rand = "0.8"
# JSON para el subcomando de conformidad del CLI y la persistencia de progress/memory.
# `preserve_order`: los objetos JSON entrantes preservan el orden de inserción (como
# el dict de Python), para paridad byte-a-byte en las respuestas del server.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Fecha/hora para los builtins de time (UTC). Sin feature `clock` → sin riesgo de C;
# now() usa std::time. HTTP cliente: std::net + rustls para https (ver stdlib/src/http.rs);
# cron usa std::thread.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# SQLite estático (binario único, sin DLL). Compila C → requiere gcc (WinLibs en Windows).
rusqlite = { version = "0.32", features = ["bundled"] }
# Secretos (feature `secret`): todo puro-Rust (RustCrypto), sin deps C → preserva el
# binario único estático.
#   zeroize  : borra el plaintext de memoria al drop (best-effort, §5 del spec).
#   subtle   : comparación constant-time (igualdad de secrets + verify_hmac, §5/§4).
#   hmac+sha2: HMAC-SHA256/512 para verify_hmac/hmac_sha256 (§4; SHA-1 excluido a propósito).
zeroize = "1"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
# Completitud matemática (Batch 4): ambas PURO-Rust, sin C → preservan el binario único
# estático.
#   libm        : funciones especiales (gamma/lgamma/erf/erfc); port Rust de musl libm (rust-lang).
#   num-complex : tipo complejo + cmath (mismo ecosistema num-* que num-bigint/num-traits/num-integer).
libm = "0.2"
num-complex = "0.4"
# Arrays numéricos n-dimensionales + álgebra lineal (Batch 5). AMBAS PURO-Rust, SIN C
# (sin BLAS/LAPACK/openblas/mkl ni ningún `*-sys`) → preservan el binario único estático.
#   ndarray : tipo array n-dimensional + vectorización/broadcasting/reducciones.
#   faer    : álgebra lineal densa puro-Rust (solve/det/inv/eig/svd), con SIMD (pulp/gemm).
# `default-features = false`: se desactiva `rayon` (multihilo) porque arrastra `spindle →
# atomic-wait → windows-sys` (un crate `*-sys`); la regla "cero `*-sys`" manda sobre el
# multihilo. Queda el SIMD (pulp) → sigue rápido y 100% puro-Rust sin `*-sys`.
ndarray = "0.16"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
# Postgres nativo (M1). Driver SYNC `postgres` (envuelve tokio-postgres con su propio
# runtime tokio interno → el intérprete sigue sync). Puro-Rust + TLS rustls (mismo backend
# ring que el resto de stdlib) → binario único intacto, sin `*-sys`.
postgres = { version = "0.19", features = [
    "with-chrono-0_4",       # timestamp/date ↔ chrono (ya es dep)
    "with-uuid-0_8",         # uuid ↔ uuid crate (feature disponible en este postgres)
    "with-serde_json-1",     # json/jsonb ↔ serde_json::Value (ya es dep)
] }
# NUMERIC ↔ Decimal: lo provee rust_decimal con su feature `db-postgres` (NO existe una
# feature `with-rust_decimal-1` en `postgres`).
tokio-postgres-rustls = "0.12"
uuid = "0.8"
# MySQL nativo SYNC (M2). Driver puro-Rust `mysql` (rust-mysql-simple). DOS trampas de
# features (lección M1: verificar el nombre que RESUELVE, no el del spec):
#   1) `minimal` = `flate2/zlib` → libz-sys (C). Se usa `minimal-rust` = `flate2/rust_backend`
#      (miniz_oxide puro-Rust, ya en el árbol por flate2).
#   2) `rustls-tls` = `rustls/aws_lc_rs` → aws-lc-sys (C/cmake). Se usa `rustls-tls-ring` =
#      `rustls/ring`, el MISMO backend ring que el resto del stdlib → cero `*-sys` nuevo.
# `default-features = false` apaga el `native-tls`/OpenSSL del default. TLS opt-in (§conexión).
# Verificado con `cargo tree -p synsema-stdlib`: no entra ni aws-lc-sys ni openssl ni libz-sys.
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
# MongoDB (M3, primer backend NO-SQL). El crate `mongodb` es async-only → feature `sync`
# (wrapper con runtime tokio interno, como el `postgres` sync → el intérprete sigue sync).
# TRES features necesarias (verificadas en el Cargo.toml del crate, no asumidas):
#   - `sync`        : el wrapper síncrono (`mongodb::sync::{Client,Database,Collection}`).
#   - `rustls-tls`  : = `rustls/ring` + `tokio-rustls/ring` (provider RING; aws-lc va en la
#                     feature SEPARADA `rustls-tls-aws-lc`, que NO activamos → cero `*-sys`).
#   - `bson-3`      : `default-features = false` apaga el bson del default (que entra vía
#                     `compat-3-0-0`→`bson-2`); el crate tiene un `compile_error!` si no hay
#                     bson-2 NI bson-3. Activamos bson-3 (v3.1, puro-Rust) → `mongodb::bson`.
#   - `compat-3-3-0`: flag VACÍO de forward-compat que el crate EXIGE con un `compile_error!`
#                     (al venir el default desactivado, hay que activarlo a mano).
# Se apaga del default: openssl-tls y dns-resolver (SRV/`mongodb+srv://` necesitaría
# re-activar dns-resolver; el dev usa `mongodb://host:port` plano). Verificado con
# `cargo tree -p synsema-stdlib`: sin aws-lc-sys/openssl/ningún `*-sys` nuevo.
mongodb = { version = "3", default-features = false, features = ["sync", "rustls-tls", "bson-3", "compat-3-3-0"] }
# Redis (M4, 4º backend remoto, 3er paradigma: KV/cache/estructuras, NO SQL ni documentos).
# API SÍNCRONA NATIVA: la `redis::Connection` bloqueante es la base del crate; lo async vive
# detrás de features `*-comp` que NO activamos → el intérprete sigue sync (sin block_on).
# `default-features = false` apaga el default (acl/streams/geospatial/script/keep-alive + nada de
# native-tls) — sólo necesitamos la conexión sync base (Cmd/Value/ToRedisArgs/FromRedisValue, que
# NO están gateadas por feature) + TLS rustls para `rediss://`. El lock usa EVAL crudo (no el
# `redis::Script` del feature `script`).
# TLS — la trampa recurrente de M2/M3 (aws-lc-sys) NO aplica acá: el crate declara
# `rustls = { version = "0.23", default-features = false }` (sin provider) y `tls-rustls` sólo
# agrega `rustls/std` + rustls-native-certs. El provider RING entra por UNIFICACIÓN de features
# con el `rustls = { features = ["ring"] }` de este mismo stdlib (nadie activa `aws_lc_rs`). El dev
# es `redis://` plaintext; el path `rediss://` queda disponible con ring. Verificado con
# `cargo tree -p synsema-stdlib`: cero `*-sys` nuevo (siguen sólo libsqlite3-sys y windows-sys).
redis = { version = "0.32", default-features = false, features = ["tls-rustls"] }
# LLM local embebido (spec LLM-LOCAL F1): inferencia GGUF cuantizada en CPU con candle.
# SOLO entran con la feature `llm-local` de synsema-runtime (deps opcionales) — el build
# default NO las compila (cargo tree idéntico a antes; verificado en la aceptación F1).
# `default-features = false`: fuera cuda/metal/accelerate/mkl (los backends van por
# feature en candle); el backend CPU (gemm/pulp/rayon) es puro Rust.
# candle-core y candle-transformers PINNEADAS a la misma versión (comparten tipos).
candle-core = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
# Tokenizer HF para reconstruir el vocabulario DESDE la metadata del GGUF (sin sidecar
# tokenizer.json). NUESTRO tokenizers (0.23) es puro Rust: `fancy-regex` en vez del
# default `onig`, sin `esaxx_fast` (C++, solo sirve para TRAINING). PERO candle-core 0.11
# arrastra su PROPIO tokenizers 0.22 con features=["onig"] hardcodeado upstream
# (no-opcional; 0.11 es la última versión) → `onig_sys` (oniguruma, C) entra al build
# feature-ON inevitablemente, y el binario ON compila DOS copias de tokenizers. Segunda
# excepción C del workspace tras libsqlite3-sys, SOLO en el binario opt-in; el build
# default queda puro-Rust (cero candle/tokenizers, verificado con cargo tree).
# NO deduplicar bajando nuestra dep a 0.22: la unión de features activaría `onig` también
# en NUESTRA copia (tokenizers usa el motor C cuando la feature está presente) — dos
# copias con la nuestra limpia es el mejor arreglo disponible.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# CSV RFC 4180 (Batch 8): parser/writer de BurntSushi, PURO-Rust sin C (deps: csv-core/
# itoa/ryu/serde, cero `*-sys`) → preserva el binario único estático. Sólo la mecánica
# de quoting/records; la conversión texto↔SynValue vive en synsema-core/src/csv.rs.
csv = "1"
# Export PNG/PDF (Batch 9): rasterización SVG (stack resvg, RazrFalcon/linebender) +
# SVG→PDF vectorial (svg2pdf, ecosistema typst). TODO PURO-Rust, SIN C (cero `*-sys`).
# `default-features = false` en resvg/usvg: fuera `system-fonts` (I/O de fuentes del SO,
# rompería el determinismo multiplataforma G5 y metería I/O en un builtin puro) y fuera
# `raster-images` (decodificado de <image> embebidas — features mínimas, doctrina M2/M3:
# verificar lo que RESUELVE, no lo que promete). El texto SVG rasteriza con UNA fuente
# embebida (DejaVu Sans vía include_bytes!, ver raster.rs; licencia en NOTICE).
# Las versiones de resvg/usvg y svg2pdf deben compartir EL MISMO usvg (svg2pdf recibe el
# usvg::Tree por tipo) — verificado con `cargo tree -p synsema-stdlib`.
resvg = { version = "0.45", default-features = false, features = ["text"] }
usvg = { version = "0.45", default-features = false, features = ["text"] }
tiny-skia = "0.11"
fontdb = { version = "0.23", default-features = false }
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
# Criptografía de blockchain (Batch 11): firmar/verificar/derivar para operar
# on-chain (ETH/Avalanche/Solana/Algorand) con la clave sellada como `secret`.
# TODO PURO-Rust (RustCrypto/dalek/rust-bitcoin), CERO `*-sys`/C — doctrina del
# binario único estático (verificado con `cargo tree`). SOLO criptografía
# defensiva: firma gateada (`require sign`) + audit; verificación/derivación puras.
#   k256          : secp256k1 + ECDSA (RustCrypto). `ecdsa` trae firma RFC 6979
#                   (nonce determinista), low-s y recovery id (ecrecover).
#   ed25519-dalek : Ed25519 RFC 8032 (Solana/Algorand). Determinista por diseño.
#   sha3          : Keccak-256 PRE-NIST (el de Ethereum; ≠ SHA3-256 estándar).
#   bs58          : base58 de Bitcoin/Solana (lo usa core en bytes()/decode()).
#   bech32        : bech32/bech32m BIP-173/350 (Avalanche X/P; direcciones segwit).
# `schnorr` (Batch 16): firma BIP-340 de taproot — el MISMO crate ya presente, cero
# dep nueva para firmar Bitcoin (el módulo schnorr viene dentro de k256).
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "schnorr"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
sha3 = { version = "0.10", default-features = false, features = ["std"] }
bs58 = "0.5"
bech32 = "0.11"
# Batch 13 (blockchain etapa 3): custodia HD + keystore V3 + Solana PDA + WebSocket.
# TODO PURO-Rust, CERO `*-sys`/C (doctrina del binario único; verificar con `cargo tree`).
#   bip39            : BIP-39 (rust-bitcoin). Wordlist inglesa embebida (la MISMA lista que
#                      usa el mnemónico de 25 palabras de Algorand), checksum, PBKDF2→seed.
#                      `unicode-normalization`: NFKD del passphrase (BIP-39 lo exige para
#                      no-ASCII); `zeroize`: borra la frase al drop (mismo criterio que secret).
#   pbkdf2           : KDF del keystore V3 variante pbkdf2 (RustCrypto; ya estaba transitivo).
#   scrypt           : KDF del keystore V3 variante scrypt (RustCrypto). `default-features =
#                      false`: fuera `simple`/password-hash (sólo se necesita la función cruda).
#   aes + ctr        : AES-128-CTR del keystore V3 (RustCrypto).
#   curve25519-dalek : decompress ed25519 para el off-curve check de `solana_pda`
#                      (findProgramAddress) — EXACTAMENTE el mismo crate/chequeo que usa el
#                      SDK oficial de Solana. Ya estaba en el árbol vía ed25519-dalek.
#   tungstenite      : WebSocket cliente SÍNCRONO (calza con el engine sync). `default-features
#                      = false` + `handshake`: NINGUNA feature TLS del crate (arrastrarían un
#                      rustls con provider aws-lc-sys) — el TLS de `wss://` lo pone ws.rs con
#                      el MISMO rustls/ring + rustls-native-certs que http.rs.
bip39 = { version = "2", default-features = false, features = ["std", "unicode-normalization", "zeroize"] }
# Batch 16 (Bitcoin): ripemd160 — la ÚNICA pieza de hash160 (= ripemd160(sha256(x)),
# el hash de direcciones de Bitcoin) que faltaba en el árbol. RustCrypto puro-Rust,
# misma familia que hmac/sha2/pbkdf2 ya presentes; CERO `*-sys`/C (G8).
ripemd = { version = "0.1", default-features = false }
# Tanda web-auth: password hashing argon2id (password_hash/password_verify) con
# parámetros OWASP. RustCrypto puro-Rust (misma familia que hmac/sha2/pbkdf2/scrypt
# ya presentes), sin `*-sys`/C → preserva el binario único estático. La ÚNICA dep
# nueva de la tanda (mismo criterio con que Batch 16 agregó `ripemd`).
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
ctr = "0.9"
curve25519-dalek = { version = "4", default-features = false }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
synsema-core = { path = "crates/synsema-core" }
synsema-capabilities = { path = "crates/synsema-capabilities" }
synsema-stdlib = { path = "crates/synsema-stdlib" }
synsema-agents = { path = "crates/synsema-agents" }
synsema-llm = { path = "crates/synsema-llm" }
synsema-runtime = { path = "crates/synsema-runtime" }

[profile.release]
opt-level = 3
lto = true
