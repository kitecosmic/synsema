[package]
name = "synsema-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synsema core: lexer, parser, AST, value model, interpreter"

[features]
# Sólo tests: el oráculo del resolver (src/resolve.rs, `check`). Lo prende synsema-runtime en sus
# dev-dependencies para `oracle_run --resolver-check`; el binario nunca lo compila.
resolver-check = []
# Sólo para elegir superinstrucciones (F3.5 de specs/compute-rendimiento.md): la VM cuenta qué
# instrucciones corren y qué pares seguidos. El binario nunca lo compila.
vm-profile = []
# F4 (specs/compute-rendimiento.md): el enganche seguro del nivel nativo (`native_tier`), sin
# dependencias. Lo prende synsema-jit (Cranelift, el único crate con `unsafe` del nivel nativo);
# wasm, wasm-web y el guest de Vela no lo compilan.
native-tier = []

[dependencies]
# El texto (F4.6b de specs/compute-rendimiento.md): en línea hasta 15 B, compartido, y agregar en el
# lugar con un solo dueño. El `unsafe` del texto vive ahí, no en core.
synsema-text = { path = "../synsema-text" }
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true
indexmap.workspace = true
regex.workspace = true
# `codeintel` (synsema code): salida JSON determinista (preserve_order ya está en el workspace).
serde_json.workspace = true
# Tipo Decimal exacto (dinero/finanzas): rust_decimal, puro Rust, 96-bit.
rust_decimal = { workspace = true, features = ["maths"] }
# Tipo `secret`: zeroize del plaintext al drop + igualdad constant-time (§5 del spec).
zeroize.workspace = true
subtle.workspace = true
# Completitud matemática (Batch 4): funciones especiales (libm) y tipo complejo + cmath
# (num-complex). Ambas puro-Rust, sin C → binario único estático.
libm.workspace = true
num-complex.workspace = true
# Arrays n-dimensionales + álgebra lineal (Batch 5): ndarray + faer, puro-Rust sin C.
ndarray.workspace = true
faer.workspace = true
# base58 (Batch 11): formato de bytes()/decode() (Solana/Bitcoin). Crate canónico
# puro-Rust — código de direcciones de dinero: no se hand-rollea. base32 sí es
# hand-rolled en bytesutil (RFC 4648, trivial).
bs58.workspace = true
# Bundle de `synsema build` (bundle.rs): sha256 del payload anexado al ejecutable.
sha2.workspace = true
# Fechas, instantes y duraciones como tipos (v0.6.29, DATOS-13): chrono + la base IANA.
chrono.workspace = true
chrono-tz.workspace = true
# La sal de los compromisos del linaje (v0.6.29): entropía del SO. En wasm32-unknown-unknown la da
# el host (synsema-wasm-web registra `register_custom_getrandom!` sobre crypto.getRandomValues);
# el reloj del sistema ahí no existe y hacía pánico. Ya estaba en el árbol (0.2, vía rand).
getrandom = "0.2"
# Los argumentos de una llamada sin pedir memoria para los primeros 4 (F1.7 de
# specs/compute-rendimiento.md). Ya estaba en el árbol (vía stdlib); directa no agrega crate.
smallvec.workspace = true
# El índice de nombres de un entorno con muchos bindings (F2a). Ya estaba en el árbol.
rustc-hash.workspace = true

[[example]]
name = "vmprof"
required-features = ["vm-profile"]
