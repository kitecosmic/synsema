[package]
name = "synsema-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synsema como artefacto WebAssembly: el intérprete + el perfil puro de la stdlib (wasm32-wasip1)"

[dependencies]
synsema-core.workspace = true
synsema-capabilities.workspace = true
synsema-agents.workspace = true
# Sin `native`: el perfil PURO (sin sockets/DB/threads del SO). Dep por path (no
# workspace = true): un member no puede apagar los default-features de una entrada
# de workspace.dependencies — por path sí. En el build --workspace la unificación
# de features vuelve a encender `native` (runtime la trae); este main sólo usa la
# superficie compartida entre ambos perfiles, así que compila idéntico en los dos.
synsema-stdlib = { path = "../synsema-stdlib", default-features = false }
