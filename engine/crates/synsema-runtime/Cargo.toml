[package]
name = "synsema-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synsema runtime: engine, daemon, persistence, recovery, speculative, error_reporter"

[dependencies]
synsema-core.workspace = true
synsema-capabilities.workspace = true
synsema-stdlib.workspace = true
synsema-agents.workspace = true
synsema-llm.workspace = true
indexmap.workspace = true
regex.workspace = true
serde_json.workspace = true
# StatePersistence cross-run: SQLite (mismo esquema/ruta que el oráculo persistence.py).
rusqlite.workspace = true
# A1 Fase 2: ejecutor M:N de parallel_map sobre tokio (runtime + spawn_blocking + semáforo).
# v0.6.20: `signal` para el listener de SIGHUP (recarga del .env bajo serve). La feature ya
# entra al build por stdlib (unificación): cero compilación nueva de tokio.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "signal"] }
# LLM local (feature `llm-local`): el crate de inferencia, opcional — el build default no
# lo compila ni descarga candle al árbol de deps. Ver src/llm_local.rs, que desde la tanda I1
# es sólo el adaptador entre el protocolo LLM y `synsema-infer`: este crate ya NO nombra a
# candle ni a tokenizers (criterio C1 del spec).
synsema-infer = { workspace = true, optional = true }

[features]
# Provider LLM `local` (spec LLM-LOCAL F1): inferencia GGUF cuantizada embebida (candle,
# CPU). Opt-in explícito: `cargo build --features llm-local` (o vía synsema-cli). Sin la
# feature, `SYNSEMA_LLM_PROVIDER=local` avisa por stderr y queda offline (placeholders) —
# jamás elige otro provider en silencio.
# Desde I5 tambien enciende `rust-backend`: el camino declarativo ES el decoder propio, y
# tenerlo colgando de `judge-laya` hacia que `SYNSEMA_INFER_BACKEND=rust` dependiera de una
# feature que no tiene nada que ver.
llm-local = ["dep:synsema-infer", "synsema-infer/gguf", "synsema-infer/rust-backend"]
# Backend LOCAL de `judge` (tanda I3): Laya, encoder ModernBERT + cabezas de decision. Opt-in
# aparte de `llm-local` porque un build que solo quiere GGUF no tiene por que cargar el encoder.
judge-laya = ["dep:synsema-infer", "synsema-infer/arch-modernbert", "synsema-infer/rust-backend"]

[dev-dependencies]
# E2E del Batch 13: un mini-servidor WS LOCAL para el dogfood del cliente WebSocket
# (sin red externa). El mismo tungstenite que usa el stdlib, en modo `accept`.
tungstenite = { workspace = true }
# E2E del Batch 16 (Bitcoin): el mock Esplora recomputa el txid (dSHA256 sin
# witness) de los bytes posteados para validar honestamente btc_send.
sha2 = { workspace = true }
# E2E de T5 (mTLS): par cert/clave de prueba para `mtls_identity`. Mismo crate y
# features que ya usa synsema-stdlib en sus tests de TLS (backend ring, sin C).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# E2E de T4 (serve --attested): cliente TLS que PINEA el SPKI anunciado en
# /.well-known/attestation (un verificador custom, exactamente lo que hará un cliente). El
# mismo rustls/ring que ya compila synsema-stdlib; cero crates nuevos.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Ídem: comprobar que el escalar de `attestation_key()` es la clave P-256 anunciada (ECDH
# desde ambos lados). El mismo p256 que compila synsema-stdlib.
p256 = { workspace = true }
