[package]
name = "synsema-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synsema stdlib: http, database, templates, cron, server"

[dependencies]
synsema-core.workspace = true
synsema-capabilities.workspace = true
# Bus de eventos del proceso (pub/sub) — lo consume el hub de I/O de ws.rs (`select`).
synsema-agents.workspace = true
indexmap.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
# M1 — Postgres nativo bajo la API universal db_open/sql. Puro-Rust + TLS rustls.
postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
rust_decimal.workspace = true
# M2 — MySQL nativo bajo la misma API. Driver sync puro-Rust + TLS rustls (opt-in).
mysql = { workspace = true, optional = true }
# M3 — MongoDB (backend no-SQL, API propia mongo_*). Driver sync (wrapper async) + rustls ring.
mongodb = { workspace = true, optional = true }
# M4 — Redis (backend KV/cache/estructuras, API propia redis_*). Conexión SÍNCRONA nativa del
# crate + TLS rustls (provider ring por unificación de features, sin `*-sys`). Ver el comentario
# en el Cargo.toml del workspace.
redis = { workspace = true, optional = true }
# Token aleatorio del lock distribuido (redis_lock): se reusa el `rand` que el engine YA usa
# (random()/random_int() en synsema-capabilities) — no se introduce un crate nuevo. Puro-Rust.
rand.workspace = true
# Arrays (Batch 5): serializar `SynValue::Array` a JSON anidado en las respuestas serve.
ndarray.workspace = true
# Export PNG/PDF (Batch 9): svg_to_png/svg_to_pdf en raster.rs. Puro-Rust, sin C (ver workspace).
resvg.workspace = true
usvg.workspace = true
tiny-skia.workspace = true
fontdb.workspace = true
svg2pdf.workspace = true
# v0.6.20: xml_parse (roxmltree, ya transitiva de usvg) y toml_parse/toml_encode. Puros.
roxmltree.workspace = true
toml.workspace = true
# Feature `secret`: builtins env/secret/reveal/bearer + crypto (hmac_sha256/verify_hmac/
# constant_time_eq). Todo puro-Rust (RustCrypto), sin C → binario único estático.
# chrono ya está en el workspace (sin feature `clock`); se usa para el timestamp del audit.
hmac.workspace = true
sha2.workspace = true
subtle.workspace = true
chrono.workspace = true
# Blockchain (Batch 11): curvas + Keccak + bech32, todo puro-Rust sin `*-sys` (ver
# el comentario de doctrina en el workspace). zeroize: borrar la copia temporal de
# la clave decodificada tras firmar (best-effort, mismo criterio que el tipo secret).
k256.workspace = true
ed25519-dalek.workspace = true
sha3.workspace = true
bech32.workspace = true
zeroize.workspace = true
# BigInt para el encoding RLP de enteros grandes (ya en el árbol vía core; puro-Rust).
num-bigint.workspace = true
# Batch 13 (blockchain etapa 3): HD wallets (bip39 + BIP-32/SLIP-0010 hand-rolled con
# hmac/sha2/k256 ya presentes), keystore V3 (scrypt/pbkdf2 + aes/ctr), off-curve check
# de solana_pda (curve25519-dalek, el mismo del SDK oficial) y cliente WebSocket
# (tungstenite sin TLS propio — wss usa el rustls/ring de este crate). Ver workspace.
bip39.workspace = true
# Batch 16 (Bitcoin): ripemd160 para hash160 (ver la justificación en el workspace).
ripemd.workspace = true
# Tanda web-auth (webauth.rs): password hashing argon2id — la única dep nueva de la
# tanda (ver la justificación en el workspace). sha1 se PROMUEVE de dev-dep a directa
# SOLO para el HMAC-SHA1 de TOTP (RFC 6238; ya estaba en el árbol vía tungstenite) —
# NO se expone como builtin de hash.
argon2.workspace = true
sha1 = "0.10"
# T3 (oidc_verify): RS256 + ES256 para verificar tokens de IdPs de terceros. Ver la
# justificación (y el aviso k256 ≠ P-256) en el Cargo.toml del workspace.
rsa.workspace = true
p256.workspace = true
pbkdf2.workspace = true
scrypt.workspace = true
aes.workspace = true
ctr.workspace = true
# Tanda PWA (webpush.rs): AES-128-GCM de Web Push — la ÚNICA dep nueva de la tanda
# (ver la justificación en el workspace). ECDH P-256 es la feature `ecdh` de p256.
aes-gcm.workspace = true
# v0.6.20 (crypto.rs): ECDH P-521 + HKDF-SHA256 (AES-GCM es el aes-gcm de arriba). Puros.
p521.workspace = true
hkdf.workspace = true
# Attestation (attestation.rs / attest.rs): ES384 + parser X.509 para verificar documentos de
# attestation (Nitro COSE_Sign1) y para el driver `mock` de `attest`. Ver el workspace.
p384.workspace = true
x509-parser.workspace = true
curve25519-dalek.workspace = true
# T7b (zk.rs): `groth16_verify` sobre BN254 con arkworks (verificación sola, sin probador).
# Puro-Rust `no_std`, sin `parallel`/`asm`/`std`; ver la justificación en el workspace.
ark-bn254.workspace = true
ark-groth16.workspace = true
ark-ec.workspace = true
ark-ff.workspace = true
ark-serialize.workspace = true
ark-std.workspace = true
tungstenite = { workspace = true, optional = true }
# Tanda pty (`proc_spawn(..., {pty: true})`): pseudo-terminal cross-platform — openpty en
# Unix, ConPTY en Windows (>= 10 1809). Es la crate de WezTerm; sin C-ABI nuevo (libc /
# winapi ya están en el árbol). Sólo la abre `proc.rs`; el runtime NO interpreta VT.
portable-pty = { version = "0.9", optional = true }
# Tanda term (`term_open`: la terminal propia como handle del hub): raw mode + lector de
# teclas + bracketed paste + kitty keyboard protocol + resize, cross-platform (termios vía
# rustix en Unix, SetConsoleMode/ReadConsoleInput vía crossterm_winapi en Windows). Sin
# `*-sys` nuevo (winapi/libc/mio/parking_lot ya están en el árbol; rustix y signal-hook son
# puro Rust). Sin `event-stream`/`serde`. Sólo lo abre `term.rs`; el runtime NO dibuja.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "bracketed-paste"], optional = true }
# Batch 15 (WebSocket de primera clase): poller de readiness cross-platform
# (epoll/kqueue/IOCP) para el multiplexado no-bloqueante de ws_select. YA está en el
# árbol (v1.2.1, transitivo de tokio/hyper) — hacerlo directo NO agrega crate ni C-ABI
# nuevo (mio son bindings de syscalls del SO ya presentes, no una lib C que compile). G8.
mio = { version = "1", features = ["os-poll", "net"], optional = true }
# A2 stack web: gzip (miniz_oxide puro-Rust, sin C) + TLS (rustls con backend ring).
flate2 = { version = "1", optional = true }
# v0.6.20 (archive.rs): zip_*/tar_* — SÓLO native (extraer toca disco; en el perfil puro son
# stubs). Comparten el flate2 de arriba.
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
# `serve --attested`: certificado autofirmado con la clave P-256 que la attestation
# ata (TLS pineado a esa clave). rcgen 0.13 YA es dev-dep de este crate y esta en el arbol via
# instant-acme; hacerlo dep normal (solo native) no agrega crate. Backend ring, sin C.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"], optional = true }
# Cliente HTTPS (http_get/http_post con https://): root CAs del SO vía rustls-native-certs.
# Ya está en Cargo.lock (transitivo de instant-acme); se hace directo para usarlo en http.rs.
rustls-native-certs = { version = "0.8", optional = true }
# A2 batch 2 — ACME/auto-HTTPS. instant-acme (cliente ACME) con backend ring (sin C/cmake),
# cliente HTTP propio (hyper-rustls) y `rcgen` interno para keygen/CSR en finalize().
# tokio = runtime async acotado SÓLO para obtener/renovar el cert; el server sigue std::net.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"], optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal"], optional = true }
# Lote 2 — rewrite de serve a async: hyper (HTTP/1.1 + HTTP/2) + adaptadores tokio +
# TLS async (tokio-rustls con ring). El intérprete sigue sync por request (spawn_blocking).
hyper = { version = "1", default-features = false, features = ["server", "client", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["server", "server-auto", "server-graceful", "http1", "http2", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# Parquet (v0.6.29, DATOS-16): la API de filas, SIN arrow (sólo listas de mapas). Códecs:
# snappy/gzip/lz4 en Rust puro + zstd (C vía cc: es el default de polars y sin él no se leen
# sus archivos). Sólo en `native` (el perfil wasm no lo lleva).
parquet = { version = "60", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "zstd", "simdutf8"], optional = true }
chrono-tz.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }

# Perfil del crate. `native` (default) = los módulos que hablan con el SO: sockets
# (http/server/ws/acme), threads de scheduler (cron) y drivers de DB (database) —
# con TODAS sus deps (las `optional = true` de arriba). Sin `native`
# (`--no-default-features`) queda el subconjunto PURO que compila a wasm32:
# blockchain completo (con stub de transporte), hashing, webauth, oidc, httpsig,
# captoken, secrets, spend, charts, raster, json, mimetypes. CI lo ancla contra
# wasm32-wasip1 para que una tanda futura no lo rompa en silencio.
[features]
default = ["native"]
native = [
    "rust_decimal/db-postgres",
    "dep:rusqlite",
    "dep:postgres",
    "dep:tokio-postgres-rustls",
    "dep:uuid",
    "dep:mysql",
    "dep:mongodb",
    "dep:redis",
    "dep:mio",
    "dep:flate2",
    "dep:zip",
    "dep:tar",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:rustls-native-certs",
    "dep:instant-acme",
    "dep:tokio",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:bytes",
    "dep:tokio-rustls",
    "dep:tungstenite",
    "dep:portable-pty",
    "dep:crossterm",
    "dep:parquet",
]

# Sólo Windows: leer HKCR para replicar mimetypes.read_windows_registry (content-type
# de estáticos con extensión no pinneada). En otros SO el override del registro es no-op.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Tree-kill de `proc_*` en Windows: Job Objects (CreateJobObject / AssignProcessToJobObject /
# TerminateJobObject, KILL_ON_JOB_CLOSE). windows-sys YA está en el árbol (mio/tokio/etc.);
# hacerlo directo no agrega crate ni C-ABI nuevo — son bindings de syscalls, no una lib C.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Sólo Unix: `proc_kill(h, "TERM")` manda SIGTERM (kill(2)). libc ya está en el árbol
# (transitivo de mio/tokio); hacerlo directo no agrega crate ni C-ABI nuevo.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Cert self-signed para los tests de integración TLS (backend ring, sin C/cmake).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
